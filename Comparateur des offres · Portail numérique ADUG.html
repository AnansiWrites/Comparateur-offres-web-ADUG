<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparateur des offres · Portail numérique ADUG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --forest:#14573F; --green:#13926E; --leaf:#A5CC78; --mint:#D9F2EA;
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F3F8F5; --ink:#123B30; --muted:#4E6B61; --line:#D9E8E0;
  --adv-bg:#D9F2EA; --adv-fg:#0F5A40; --warn-bg:#FBEFD9; --warn-fg:#7A4800; --arb-bg:#E4ECF5; --arb-fg:#24507A; --neu-bg:#F1F4F2; --neu-fg:#4E6B61;
  --side-ink:#FFFFFF; --side-muted:#CFE9DD;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1A16; --surface:#15241F; --soft:#13211C; --ink:#E8F2EE; --muted:#A8BDB4; --line:#24382F;
    --adv-bg:#1E3A30; --adv-fg:#A5CC78; --warn-bg:#3A2A12; --warn-fg:#F2C27A; --arb-bg:#1D2A3A; --arb-fg:#9DBBE0; --neu-bg:#1E2925; --neu-fg:#A8BDB4;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1A16; --surface:#15241F; --soft:#13211C; --ink:#E8F2EE; --muted:#A8BDB4; --line:#24382F;
  --adv-bg:#1E3A30; --adv-fg:#A5CC78; --warn-bg:#3A2A12; --warn-fg:#F2C27A; --arb-bg:#1D2A3A; --arb-fg:#9DBBE0; --neu-bg:#1E2925; --neu-fg:#A8BDB4;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
.side{background:var(--forest);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto;position:relative}
.brand{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand img{width:132px;height:auto;display:block;margin-bottom:18px}
.brand h1{font-size:19px;font-weight:800;line-height:1.25;margin:0 0 4px}
.brand p{margin:0;font-size:14px;color:var(--side-muted)}
.brand .stamp{display:inline-block;margin-top:14px;background:var(--leaf);color:var(--forest);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
nav{padding:14px 12px 28px;flex:1}
nav .grp{font-size:13px;font-weight:700;color:var(--leaf);margin:18px 12px 6px}
nav a{display:flex;gap:12px;align-items:baseline;color:var(--side-ink);text-decoration:none;font-size:15px;font-weight:500;padding:9px 12px;border-radius:12px;line-height:1.3}
nav a .n{font-size:12px;color:var(--side-muted);min-width:18px}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current="page"]{background:#FFFFFF;color:var(--forest);font-weight:700}
nav a[aria-current="page"] .n{color:var(--green)}
.side::after{content:"";position:absolute;right:-90px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
main{display:flex;flex-direction:column;min-width:0;height:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 40px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar .lbl{font-size:14px;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#FFFFFF}
.scroll{flex:1;overflow-y:auto}
.view{max-width:1240px;margin:0 auto;padding:40px 40px 56px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:700;font-size:15px;margin:0 0 10px}
.crumb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--leaf)}
h2{font-size:40px;line-height:1.12;font-weight:800;color:var(--forest);margin:0 0 10px;letter-spacing:-.01em}
:root[data-theme="dark"] h2{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2{color:var(--leaf)}}
.q{font-size:19px;color:var(--muted);margin:0 0 28px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;transition:opacity .25s,border-color .25s}
.card .who{font-size:15px;font-weight:700;color:var(--muted)}
.card .val{font-size:21px;font-weight:800;line-height:1.25;color:var(--ink)}
.card .det{font-size:15px;color:var(--muted);margin:0}
.card.on{border-color:var(--green);border-width:2.5px}
.card.dim{opacity:.38}
.mk{display:inline-flex;align-items:center;gap:6px;width:fit-content;font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px}
.mk.adv{background:var(--adv-bg);color:var(--adv-fg)} .mk.warn{background:var(--warn-bg);color:var(--warn-fg)}
.mk.arb{background:var(--arb-bg);color:var(--arb-fg)} .mk.neu{background:var(--neu-bg);color:var(--neu-fg)}
.impact{margin-top:28px;background:var(--forest);color:#FFFFFF;border-radius:20px;padding:26px 30px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px}
.impact h3{margin:0;font-size:20px;line-height:1.3;color:var(--leaf)}
.impact p{margin:0 0 10px;font-size:16.5px;line-height:1.55;max-width:75ch}
.impact p:last-child{margin-bottom:0}
.opts{margin-top:28px}
.opts h3{font-size:20px;color:var(--forest);margin:0 0 12px}
:root[data-theme="dark"] .opts h3{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opts h3{color:var(--leaf)}}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--forest);color:#FFFFFF;text-align:left;font-weight:700;padding:12px 14px;white-space:nowrap}
td{padding:12px 14px;border-top:1.5px solid var(--line);vertical-align:top;background:var(--surface)}
.ov td{cursor:pointer}
.ov tr:hover td{background:var(--soft)}
.ov td.asp{font-weight:700;color:var(--ink);min-width:190px}
.ov td.asp small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.ov .cell{display:flex;flex-direction:column;gap:6px;min-width:120px}
.ov .cell b{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
.ov td.dim{opacity:.35}
.ov th.on{background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.note{font-size:15px;color:var(--muted);margin:18px 0 0;max-width:80ch}
footer{display:flex;align-items:center;gap:16px;padding:12px 40px;border-top:1px solid var(--line);background:var(--bg);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
footer .sig{flex:1;font-size:14px;font-weight:600;color:var(--forest);display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] footer .sig{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) footer .sig{color:var(--leaf)}}
footer .sig::before{content:"";width:14px;height:14px;background:linear-gradient(135deg,var(--green) 50%,var(--leaf) 50%);clip-path:polygon(0 30%,50% 60%,100% 30%,100% 70%,50% 100%,0 70%)}
.pg{font-size:15px;color:var(--muted);min-width:56px;text-align:center}
.nb{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
.nb:hover{border-color:var(--green)} .nb:disabled{opacity:.35;cursor:default}
.menu-btn{display:none}
a:focus-visible,button:focus-visible,td:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.impact{grid-template-columns:1fr;gap:12px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{overflow:visible}
  .brand{display:flex;align-items:center;gap:14px;padding:14px 18px}
  .brand img{width:64px;margin:0}
  .brand p,.brand .stamp{display:none}
  .brand h1{font-size:16px;flex:1;margin:0}
  .menu-btn{display:block;font:inherit;font-size:14px;font-weight:700;background:#FFFFFF;color:var(--forest);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
  nav{display:none;padding-top:0}
  .side.open nav{display:block}
  .side::after{display:none}
  .bar,.view,footer{padding-left:18px;padding-right:18px}
  .grid{grid-template-columns:1fr}
  h2{font-size:30px}
}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 18px}
.tab{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.3}
.tab small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:3px}
.tab[aria-selected="true"]{background:var(--forest);border-color:var(--forest);color:#FFFFFF}
.tab[aria-selected="true"] small{color:#CFE9DD}
.sw{background:var(--soft);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
.schema{width:100%;height:auto;display:block}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sbox{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.sbox h3{margin:0 0 6px;font-size:16px;color:var(--green)}
.sbox p{margin:0;font-size:15px;line-height:1.55}
.sbox.warnb{border-color:var(--warn-fg);background:var(--warn-bg)}
.sbox.warnb h3{color:var(--warn-fg)}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--forest);color:#FFFFFF;font-weight:800;font-size:14px}
.tlw{padding:10px 16px}
@media (max-width:860px){.tabs{grid-template-columns:1fr 1fr}.sgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
</head>

<script>
const D={"P": ["Yanaweb (CRM Holding)", "Altosor", "Orphose", "Next Solutions", "Ponti’Com", "Bitwip"], "A": [{"id": "prix", "group": "Le coût", "title": "Prix sur la base commune", "q": "Combien coûte le même résultat chez chacun ?", "cells": [["!", "25 250 €", "Au-dessus de l’enveloppe avec la connexion Eudonet."], ["!", "25 368 €", "Au-dessus de l’enveloppe avec la connexion Eudonet."], ["?", "≈ 21 981 €", "Montant estimé : la connexion Eudonet n’est chiffrée qu’« environ »."], ["", "14 500 €", "Offre révisée après les questions (40 jours à 400 €)."], ["", "15 400 €", "Indépendant : tarif journalier d’environ 500 €."], ["!", "25 770 €", "Au-dessus de l’enveloppe avec la connexion Eudonet."]], "impact": ["La base commune réunit L1, L2, douze mois de maintenance et la connexion à Eudonet : c’est le seul moyen de comparer le même résultat.", "Le prix pèse 30 % de la note. Chaque euro économisé reste disponible pour les actions qui font avancer les jalons : campagnes, événements, Lemag’.", "Un prix très bas se vérifie : il doit s’expliquer par une charge réaliste, pas par un périmètre réduit."], "options": null}, {"id": "conditions", "group": "Le coût", "title": "Conditions de paiement", "q": "Quand l’UG paie-t-elle, et avant quoi ?", "cells": [["!", "Avance de 30 %", "Puis 40 % à la recette et 30 % à la mise en production."], ["!", "Avance de 40 %", "Sur L1 et L2, le reste à la livraison."], ["", "Avance facultative", "Paiement à 30 jours sur Chorus Pro."], ["!", "Avance de 40 %", "4 800 € à la commande, puis à chaque procès-verbal."], ["+", "Sans avance", "Une facture à la recette de chaque livraison."], ["!", "Avance de 30 %", "Présentée comme une condition de l’offre."]], "impact": ["Une avance, c’est payer avant tout travail. Sous 50 000 €, l’UG peut la prévoir sans y être obligée : la DAF décide.", "Au-delà de 30 %, des garanties peuvent être demandées au prestataire.", "Payer à la recette protège l’UG : on règle ce qui a été livré et vérifié.", "Engager la dépense en 2026 ne veut pas dire la payer en 2026 : le bon de commande suffit à engager le budget."], "options": null}, {"id": "maintenance", "group": "Le coût", "title": "Maintenance sur douze mois", "q": "Qui garde le portail à jour et sûr, et à quel prix ensuite ?", "cells": [["", "Incluse", "Puis 2 250 € par an, indexés. Panne bloquante corrigée sous 3 jours."], ["", "5 400 €", "450 € par mois sur douze mois."], ["!", "Incluse", "Le prix de la deuxième année sera fixé plus tard."], ["", "1 200 €", "300 € par trimestre. Panne bloquante corrigée sous 1 jour."], ["", "1 700 €", "Panne bloquante corrigée sous 1 jour."], ["", "2 990 €", "Douze mois fermes, renouvellement sur décision de l’UG. Panne bloquante corrigée sous 2 jours."]], "impact": ["Pendant un an, le prestataire met à jour WordPress et ses extensions et corrige les anomalies. La DNUM installe les correctifs : aucun prestataire n’a d’accès direct aux serveurs.", "Au bout d’un an, trois choix : renouveler, changer de prestataire ou reprendre en interne. Un coût d’année 2 connu et une documentation complète gardent ces trois portes ouvertes.", "Le délai de correction d’une panne bloquante compte : un don impossible pendant une semaine, c’est une campagne à l’arrêt."], "options": null}, {"id": "don", "group": "Le portail livré", "title": "Page de don", "q": "Le donateur reste-t-il dans le parcours de la Fondation jusqu’au paiement ?", "cells": [["", "GiveXpert intégré", "Habillage aux couleurs de la Fondation inclus dès L1."], ["", "GiveXpert intégré", ""], ["?", "Solution choisie au cadrage", "GiveXpert est évalué parmi d’autres solutions de paiement."], ["", "GiveXpert intégré", "Projet transmis à la page de don ; PayFiP possible en remplacement."], ["", "GiveXpert intégré", "Projet transmis à la page de don."], ["", "GiveXpert intégré", "Pages de don reliées à chaque projet."]], "impact": ["Un parcours continu, aux couleurs de la Fondation, rassure le donateur et limite les abandons au moment de payer.", "Le paiement se fait toujours sur la page sécurisée de l’outil de collecte : le portail ne voit ni ne stocke aucune donnée bancaire.", "Rouvrir le choix de la solution de paiement au cadrage peut retarder l’ouverture des dons, le temps que l’agent comptable la valide."], "options": null}, {"id": "jauge", "group": "Le portail livré", "title": "Jauge de collecte", "q": "Comment le montant collecté s’affiche-t-il sur chaque projet ?", "cells": [["!", "Import CSV chaque semaine", "Mise à jour automatique « très probable », à confirmer par un audit."], ["+", "Automatique", "Sous l’hypothèse d’un accès aux données de GiveXpert."], ["+", "Automatique", "Pour les dons en ligne."], ["!", "Manuelle ou import CSV", "Automatique si le contrat GiveXpert donne accès à ses données."], ["!", "Manuelle", "Automatique si l’accès aux données est ouvert."], ["!", "Manuelle", "Automatique en option, 800 €."]], "impact": ["Une jauge à jour donne envie de donner et montre l’élan d’un projet ; une jauge figée depuis trois semaines produit l’effet inverse.", "Quelle que soit l’option, les dons hors ligne connus de l’agent comptable s’ajoutent à la main."], "options": [["Manuelle", "Un éditeur saisit le montant collecté dans chaque fiche projet.", "Une tâche régulière à planifier, un risque d’oubli."], ["Import CSV", "On exporte la liste des dons depuis GiveXpert, puis on l’importe dans le portail.", "Quelques minutes par semaine, toutes les jauges mises à jour d’un coup."], ["Automatique", "Le portail interroge directement GiveXpert.", "Aucune saisie, une jauge toujours à jour, sous réserve du contrat GiveXpert et de l’accord de la DNUM."]]}, {"id": "contenus", "group": "Le portail livré", "title": "Contenus intégrés", "q": "Combien de pages le prestataire met-il en ligne avant l’ouverture ?", "cells": [["", "25 pages et 40 visuels", "Puis un numéro de Lemag’ et cinq épisodes en L2."], ["+", "40 fiches et pages", "Puis deux numéros de Lemag’ et six épisodes en L2."], ["", "20 pages ou fiches", "Avec un numéro de Lemag’ et deux épisodes."], ["+", "40 pages en L1", "Puis 30 en L2 ; 60 € par page au-delà."], ["+", "40 pages et 100 médias", "Puis 20 articles et 10 épisodes en L2."], ["!", "Une dizaine de pages", "Deux contenus par type, puis deux articles et deux épisodes en L2."]], "impact": ["Le prestataire met en ligne ce volume à partir de contenus fournis prêts à publier. Au-delà, l’équipe saisit elle-même après la formation, ou paie la saisie.", "Un volume faible reporte la saisie sur l’équipe en mars 2027, au moment où elle prépare le lancement.", "Dans tous les cas, la rédaction des textes reste à la charge de l’UG."], "options": null}, {"id": "podcast", "group": "Le portail livré", "title": "Hébergement du podcast", "q": "Où vivent les épisodes, et avec quelles statistiques ?", "cells": [["?", "Ausha ou portail", "Au choix de l’UG, sans changement de prix."], ["+", "Serveur de l’UG", ""], ["?", "UG ou plateforme externe", "Choix proposé selon la rapidité et la sécurité."], ["+", "Sur le portail", "Aucun abonnement ; environ 3 Go par an à prévoir."], ["+", "Sur le portail", "Aucun abonnement."], ["!", "Ausha", "Environ 156 € par an, abonnement souscrit par l’UG."]], "impact": ["Une plateforme externe coûte un abonnement annuel, mais offre des statistiques d’écoute détaillées et une diffusion simple sur Spotify, Apple Podcasts et Deezer.", "Sur le portail, pas d’abonnement, mais un espace de stockage à prévoir avec la DNUM et des statistiques plus limitées.", "Dans les deux cas, le flux RSS permet la diffusion sur les plateformes d’écoute."], "options": null}, {"id": "accessibilite", "group": "Le portail livré", "title": "Accessibilité", "q": "Le portail sera-t-il utilisable par tous, et comment le vérifie-t-on ?", "cells": [["+", "Au moins 90 % garantis", "Objectif de 100 %, écarts corrigés sans surcoût ; audit récent présenté en preuve."], ["", "Taux mesuré", "Sans objectif chiffré."], ["", "Taux mesuré à chaque livraison", "Sans objectif chiffré."], ["+", "Au moins 90 %, puis 95 %", "90 % en L1, 95 % en L2, conformité totale en L3."], ["", "Conformité visée", "Audit réalisé par le prestataire lui-même."], ["!", "Taux non précisé", "Audit à chaque livraison, sans objectif."]], "impact": ["L’accessibilité est une obligation légale pour un établissement public : le site publie une déclaration et un taux de conformité au RGAA.", "Un engagement chiffré se vérifie à la recette ; un simple « taux mesuré » n’engage à rien.", "Les contenus restent à la charge de l’UG : PDF balisés, sous-titres et transcriptions."], "options": null}, {"id": "socle", "group": "La technique", "title": "Socle technique", "q": "Le portail est-il libre, léger et facile à reprendre ?", "cells": [["", "WordPress, thème sur mesure", ""], ["!", "Elementor Pro et WPML", "Licences d’environ 380 € par an, à payer par carte bancaire."], ["?", "WordPress, réévalué au cadrage", "D’autres solutions pourraient être proposées avec la DNUM."], ["", "WordPress multisite", "Extensions libres et gratuites, listées dans l’offre."], ["", "WordPress, thème sur mesure", "Extensions libres."], ["", "WordPress", "Code, maquettes et fichiers sources cédés à l’UG."]], "impact": ["Une licence annuelle crée un coût récurrent et un renouvellement à suivre ; un paiement par carte est souvent impossible pour un établissement public.", "Un socle libre, léger et documenté permet à la DNUM ou à un autre prestataire de reprendre le portail sans tout refaire.", "Un socle « réévalué au cadrage » laisse une incertitude au moment du choix."], "options": null}, {"id": "relation", "group": "La technique", "title": "Outil de relation", "q": "Où l’équipe suit-elle les contacts, les dons et les entreprises ?", "cells": [["", "Eudonet, 2 250 €", "Prix ferme, sous réserve d’un audit de l’API d’Eudonet."], ["", "Eudonet, 936 €", ""], ["?", "CRM intégré au portail", "Eudonet possible, pour environ 443 € estimés."], ["", "Eudonet, 1 300 €", "Non facturé si la connexion n’est pas autorisée."], ["", "Eudonet, 1 300 €", "Facturé seulement s’il est autorisé et réalisé."], ["", "Eudonet, 1 600 €", ""]], "impact": ["Avec Eudonet, chaque formulaire du portail alimente automatiquement la fiche du contact dans l’outil prévu par l’UG. La connexion dépend du contrat Eudonet et de la sécurité informatique.", "Tant qu’elle n’est pas autorisée, le portail garde les contacts dans sa base de repli : rien n’est perdu.", "Un CRM intégré offre une seule interface sans licence, mais c’est un outil construit par le prestataire, dont l’UG dépend pour le faire évoluer."], "options": null}, {"id": "cas", "group": "La technique", "title": "Connexion CAS", "q": "L’équipe se connecte-t-elle avec ses identifiants UG ?", "cells": [["!", "Option non chiffrée", ""], ["", "Option, 468 €", ""], ["!", "Possible, non chiffrée", ""], ["+", "Incluse", "Activée si la DNUM fournit les paramètres."], ["", "Option, 300 €", ""], ["", "Option, 800 €", ""]], "impact": ["Avec le CAS, chaque membre de l’équipe se connecte au back-office avec son compte UG : pas de nouveau mot de passe, et un départ est géré directement par la DNUM.", "Sans CAS, les comptes du portail se créent et se ferment à la main."], "options": null}, {"id": "calendrier", "group": "La capacité à livrer", "title": "Calendrier", "q": "Quand le portail sera-t-il en ligne ?", "cells": [["!", "L1 début avril", "L2 début juillet."], ["", "L1 fin mars", "L2 fin juin."], ["+", "L1 et L2 fin mars", "Lemag’, podcast et offres trois mois plus tôt."], ["!", "L1 le 30 avril", "L2 le 15 juillet."], ["", "L1 fin mars", "L2 fin juin."], ["", "L1 fin mars", "L2 fin juin."]], "impact": ["2027 conditionne la phase 2 d’ADUG : chaque mois en ligne en plus, ce sont des indicateurs en plus pour le bilan.", "Un mois de décalage sur L1 retarde d’autant l’ouverture des dons et du portail entreprises.", "Les délais dépendent aussi de l’UG : des validations rapides et des contenus remis à temps."], "options": null}, {"id": "equipe", "group": "La capacité à livrer", "title": "Équipe et continuité", "q": "Que se passe-t-il si une personne clé est absente ?", "cells": [["", "Équipe à Cayenne", "Yanaweb est une marque : la société qui signe et facture reste à préciser."], ["!", "Aucun salarié", "Un auto-entrepreneur sous-traitant, à distance."], ["!", "Équipe non nommée", "Profils choisis au cadrage, recrutés en contrat de mission."], ["!", "Deux personnes", "Un seul réalisateur pour le développement, le design et l’accessibilité."], ["!", "Une seule personne", "À distance depuis Toulouse, disponible de 9 h à 16 h, heure de Guyane."], ["+", "Équipe nommée", "Relais du chef de projet sous 48 h, associé présent à Cayenne."]], "impact": ["Le portail se construit entre janvier et juillet 2027 : une absence prolongée d’une personne clé peut retarder une livraison.", "Une équipe nommée, avec un relais prévu, sécurise le calendrier.", "À distance, les ateliers et les recettes se font en visio, avec un décalage horaire à caler."], "options": null}], "X": [{"id": "outils", "group": "Ce qui reste à décider", "title": "Outils de dons et de relation", "html": "<p class=\"crumb\">Ce qui reste à décider</p><h2>Les outils de dons et de relation</h2><p class=\"q\">Le cahier des charges préconise GiveXpert pour les dons et Eudonet pour la relation. Voici ce que chaque scénario change, ce qui bloque aujourd’hui et qui peut le débloquer. Ce choix sert de base au cadrage de janvier, quel que soit le prestataire retenu.</p><div class=\"tabs\" role=\"tablist\" aria-label=\"Scénarios\"><button class=\"tab\" role=\"tab\" data-sc=\"a\" aria-selected=\"true\">GiveXpert et Eudonet<small>Préconisé par le CDC</small></button><button class=\"tab\" role=\"tab\" data-sc=\"b\" aria-selected=\"false\">GiveXpert et CRM intégré au portail<small>Proposé par Orphose</small></button><button class=\"tab\" role=\"tab\" data-sc=\"c\" aria-selected=\"false\">PayFiP et Eudonet ou CRM<small>Solution publique</small></button><button class=\"tab\" role=\"tab\" data-sc=\"d\" aria-selected=\"false\">Ouvrir le portail sans dons actifs<small>Repli</small></button></div><div class=\"scp\" data-sc=\"a\"><div class=\"sw\"><svg class=\"schema\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"Schéma : le don passe par GiveXpert, les contacts vont dans Eudonet\" font-family=\"Montserrat, Arial, sans-serif\"><defs><marker id=\"ah1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"var(--green)\"></path></marker></defs><rect x=\"20\" y=\"40\" width=\"170\" height=\"64\" rx=\"14\" fill=\"var(--soft)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"105\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Donateur</text><text x=\"105\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">sur mobile ou ordinateur</text><rect x=\"260\" y=\"40\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--forest)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"355\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#FFFFFF\">Portail ADUG</text><text x=\"355\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE9DD\">fiche projet, don fléché</text><rect x=\"520\" y=\"40\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"615\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Page de don GiveXpert</text><text x=\"615\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">aux couleurs de la Fondation</text><rect x=\"760\" y=\"40\" width=\"120\" height=\"64\" rx=\"14\" fill=\"var(--mint)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"820\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Agence</text><text x=\"820\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">comptable de l’UG</text><rect x=\"260\" y=\"220\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"355\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Formulaires</text><text x=\"355\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">entreprises, alumni, médias</text><rect x=\"520\" y=\"220\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--forest)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"615\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#FFFFFF\">Eudonet</text><text x=\"615\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE9DD\">une fiche par contact</text><rect x=\"760\" y=\"220\" width=\"120\" height=\"64\" rx=\"14\" fill=\"var(--mint)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"820\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Équipes</text><text x=\"820\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">FUG et DFPU</text><line x1=\"190\" y1=\"72\" x2=\"258\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah1)\"></line><line x1=\"450\" y1=\"72\" x2=\"518\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah1)\"></line><text x=\"484\" y=\"64\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">projet</text><line x1=\"710\" y1=\"72\" x2=\"758\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah1)\"></line><text x=\"734\" y=\"64\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">don</text><line x1=\"615\" y1=\"104\" x2=\"615\" y2=\"218\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah1)\"></line><text x=\"670\" y=\"165\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">dons et reçus</text><line x1=\"355\" y1=\"104\" x2=\"355\" y2=\"218\" stroke=\"var(--green)\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\" marker-end=\"url(#ah1)\"></line><line x1=\"450\" y1=\"252\" x2=\"518\" y2=\"252\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah1)\"></line><text x=\"484\" y=\"244\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">API</text><line x1=\"710\" y1=\"252\" x2=\"758\" y2=\"252\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah1)\"></line><rect x=\"735\" y=\"118\" width=\"139\" height=\"24\" rx=\"6\" fill=\"var(--warn-bg)\"></rect><text x=\"743\" y=\"134\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--warn-fg)\">! circuit à valider</text><rect x=\"470\" y=\"300\" width=\"153\" height=\"24\" rx=\"6\" fill=\"var(--warn-bg)\"></rect><text x=\"478\" y=\"316\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--warn-fg)\">! contrat et sécurité</text></svg></div><div class=\"sgrid\"><div class=\"sbox\"><h3>Ce que ça change</h3><p>Deux outils spécialisés : GiveXpert pour la collecte, Eudonet pour la relation. Dons mensuels, dons fléchés et reçus fiscaux sont gérés nativement. L’équipe travaille dans deux interfaces : le portail pour publier, Eudonet pour suivre.</p></div><div class=\"sbox\"><h3>Pertinence pour la FUG et la DFPU</h3><p>Eudonet est conçu pour les fondations académiques et les réseaux d’alumni : une même entreprise peut y être mécène de la Fondation et cliente de la DFPU, sur une seule fiche. GiveXpert est pensé pour la collecte des fondations et associations.</p></div><div class=\"sbox warnb\"><h3>Ce qui bloque aujourd’hui</h3><p>Circuit d’encaissement et de reçus fiscaux non validé par l’agence comptable. État du contrat Eudonet et accès à son API à confirmer. Validation de la sécurité informatique. Modules GiveXpert souscrits inconnus. Aucun référent CRM désigné.</p></div><div class=\"sbox\"><h3>Qui débloque</h3><p>Agence comptable, DNUM, gouvernance FUG et DFPU, DAF pour les contrats.</p></div><div class=\"sbox\"><h3>Offres compatibles</h3><p>Les six, Orphose comprise, qui le chiffre en option.</p></div></div></div><div class=\"scp\" data-sc=\"b\" hidden><div class=\"sw\"><svg class=\"schema\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"Schéma : les contacts restent dans le portail, Eudonet est abandonné\" font-family=\"Montserrat, Arial, sans-serif\"><defs><marker id=\"ah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"var(--green)\"></path></marker></defs><rect x=\"20\" y=\"40\" width=\"170\" height=\"64\" rx=\"14\" fill=\"var(--soft)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"105\" y=\"77\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Donateur</text><rect x=\"260\" y=\"40\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--forest)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"355\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#FFFFFF\">Portail ADUG</text><text x=\"355\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE9DD\">avec CRM intégré</text><rect x=\"520\" y=\"40\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"615\" y=\"77\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Page de don GiveXpert</text><rect x=\"760\" y=\"40\" width=\"120\" height=\"64\" rx=\"14\" fill=\"var(--mint)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"820\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Agence</text><text x=\"820\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">comptable</text><rect x=\"260\" y=\"220\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--forest)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"355\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#FFFFFF\">Base de contacts</text><text x=\"355\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE9DD\">dans le portail</text><rect x=\"520\" y=\"220\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--mint)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"615\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Équipes</text><text x=\"615\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">FUG et DFPU</text><rect x=\"760\" y=\"220\" width=\"120\" height=\"64\" rx=\"14\" fill=\"var(--soft)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"820\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Eudonet</text><text x=\"820\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">abandonné ?</text><line x1=\"190\" y1=\"72\" x2=\"258\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah2)\"></line><line x1=\"450\" y1=\"72\" x2=\"518\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah2)\"></line><line x1=\"710\" y1=\"72\" x2=\"758\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah2)\"></line><text x=\"734\" y=\"64\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">don</text><line x1=\"355\" y1=\"104\" x2=\"355\" y2=\"218\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah2)\"></line><text x=\"410\" y=\"165\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">formulaires</text><line x1=\"615\" y1=\"104\" x2=\"445\" y2=\"220\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah2)\"></line><text x=\"590\" y=\"165\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">dons importés</text><line x1=\"450\" y1=\"252\" x2=\"518\" y2=\"252\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah2)\"></line><text x=\"485\" y=\"310\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">une seule interface</text><rect x=\"735\" y=\"118\" width=\"139\" height=\"24\" rx=\"6\" fill=\"var(--warn-bg)\"></rect><text x=\"743\" y=\"134\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--warn-fg)\">! circuit à valider</text><rect x=\"680\" y=\"296\" width=\"202\" height=\"24\" rx=\"6\" fill=\"var(--warn-bg)\"></rect><text x=\"688\" y=\"312\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--warn-fg)\">! sortie d’Eudonet à décider</text></svg></div><div class=\"sgrid\"><div class=\"sbox\"><h3>Ce que ça change</h3><p>Une seule interface et pas de licence CRM. Mais l’outil est construit par le prestataire : l’UG dépend de lui pour le faire évoluer.</p></div><div class=\"sbox\"><h3>Pertinence pour la FUG et la DFPU</h3><p>Suffisant pour une fiche unique et les exports des jalons. Moins riche pour la prospection, les campagnes et l’envoi d’e-mails, qu’un CRM métier gère déjà.</p></div><div class=\"sbox warnb\"><h3>Ce qui bloque aujourd’hui</h3><p>La décision de sortir d’Eudonet, à prendre au regard du contrat. Le même circuit comptable que le scénario préconisé.</p></div><div class=\"sbox\"><h3>Qui débloque</h3><p>Gouvernance FUG et DFPU, DAF, agence comptable.</p></div><div class=\"sbox\"><h3>Offres compatibles</h3><p>Orphose, qui le propose par défaut.</p></div></div></div><div class=\"scp\" data-sc=\"c\" hidden><div class=\"sw\"><svg class=\"schema\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"Schéma : le paiement passe par PayFiP, les reçus sont à développer\" font-family=\"Montserrat, Arial, sans-serif\"><defs><marker id=\"ah3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"var(--green)\"></path></marker></defs><rect x=\"20\" y=\"40\" width=\"170\" height=\"64\" rx=\"14\" fill=\"var(--soft)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"105\" y=\"77\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Donateur</text><rect x=\"260\" y=\"40\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--forest)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"355\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#FFFFFF\">Portail ADUG</text><text x=\"355\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE9DD\">fiche projet</text><rect x=\"520\" y=\"40\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"615\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">PayFiP</text><text x=\"615\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">paiement public DGFiP</text><rect x=\"760\" y=\"40\" width=\"120\" height=\"64\" rx=\"14\" fill=\"var(--mint)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"820\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Agence</text><text x=\"820\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">comptable</text><rect x=\"260\" y=\"220\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--soft)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"355\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Reçus et don mensuel</text><text x=\"355\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">à développer sur devis</text><rect x=\"520\" y=\"220\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"615\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Eudonet ou CRM</text><text x=\"615\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">selon le choix</text><rect x=\"760\" y=\"220\" width=\"120\" height=\"64\" rx=\"14\" fill=\"var(--mint)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"820\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Équipes</text><text x=\"820\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">FUG et DFPU</text><line x1=\"190\" y1=\"72\" x2=\"258\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah3)\"></line><line x1=\"450\" y1=\"72\" x2=\"518\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah3)\"></line><line x1=\"710\" y1=\"72\" x2=\"758\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah3)\"></line><text x=\"734\" y=\"64\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">don</text><line x1=\"355\" y1=\"104\" x2=\"355\" y2=\"218\" stroke=\"var(--green)\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\" marker-end=\"url(#ah3)\"></line><line x1=\"450\" y1=\"252\" x2=\"518\" y2=\"252\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah3)\"></line><line x1=\"710\" y1=\"252\" x2=\"758\" y2=\"252\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah3)\"></line><rect x=\"260\" y=\"300\" width=\"230\" height=\"24\" rx=\"6\" fill=\"var(--warn-bg)\"></rect><text x=\"268\" y=\"316\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--warn-fg)\">! fonctions de collecte absentes</text></svg></div><div class=\"sgrid\"><div class=\"sbox\"><h3>Ce que ça change</h3><p>PayFiP est la solution de paiement de la DGFiP pour les organismes publics, par carte ou prélèvement. Elle ne gère ni le reçu fiscal ni le don mensuel : il faudrait les développer, sur devis.</p></div><div class=\"sbox\"><h3>Pertinence pour la FUG et la DFPU</h3><p>Compatible par construction avec un encaissement public, mais pensée pour régler une somme due, pas pour animer une collecte.</p></div><div class=\"sbox warnb\"><h3>Ce qui bloque aujourd’hui</h3><p>L’avis de l’agence comptable, et le coût des fonctions de collecte à développer.</p></div><div class=\"sbox\"><h3>Qui débloque</h3><p>Agence comptable, DAF.</p></div><div class=\"sbox\"><h3>Offres compatibles</h3><p>Proposé en repli par Next Solutions ; à vérifier auprès des autres.</p></div></div></div><div class=\"scp\" data-sc=\"d\" hidden><div class=\"sw\"><svg class=\"schema\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"Schéma : le portail ouvre, le bouton de don reste désactivé\" font-family=\"Montserrat, Arial, sans-serif\"><defs><marker id=\"ah4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"var(--green)\"></path></marker></defs><rect x=\"20\" y=\"40\" width=\"170\" height=\"64\" rx=\"14\" fill=\"var(--soft)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"105\" y=\"77\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Donateur</text><rect x=\"260\" y=\"40\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--forest)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"355\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#FFFFFF\">Portail ADUG</text><text x=\"355\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE9DD\">projets visibles</text><rect x=\"520\" y=\"40\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--soft)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"615\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Bouton de don</text><text x=\"615\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">désactivé</text><rect x=\"760\" y=\"40\" width=\"120\" height=\"64\" rx=\"14\" fill=\"var(--mint)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"820\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Plus tard</text><text x=\"820\" y=\"86\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">après validation</text><rect x=\"260\" y=\"220\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--forest)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"355\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#FFFFFF\">Base de repli</text><text x=\"355\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE9DD\">contacts conservés</text><rect x=\"520\" y=\"220\" width=\"190\" height=\"64\" rx=\"14\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"615\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Exports CSV</text><text x=\"615\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">vers Eudonet</text><rect x=\"760\" y=\"220\" width=\"120\" height=\"64\" rx=\"14\" fill=\"var(--mint)\" stroke=\"var(--line)\" stroke-width=\"1.5\"></rect><text x=\"820\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink)\">Équipes</text><text x=\"820\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">FUG et DFPU</text><line x1=\"190\" y1=\"72\" x2=\"258\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah4)\"></line><line x1=\"450\" y1=\"72\" x2=\"518\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\" marker-end=\"url(#ah4)\"></line><line x1=\"710\" y1=\"72\" x2=\"758\" y2=\"72\" stroke=\"var(--green)\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\" marker-end=\"url(#ah4)\"></line><line x1=\"355\" y1=\"104\" x2=\"355\" y2=\"218\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah4)\"></line><text x=\"410\" y=\"165\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\" fill=\"var(--muted)\">formulaires</text><line x1=\"450\" y1=\"252\" x2=\"518\" y2=\"252\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah4)\"></line><line x1=\"710\" y1=\"252\" x2=\"758\" y2=\"252\" stroke=\"var(--green)\" stroke-width=\"2.5\"  marker-end=\"url(#ah4)\"></line><rect x=\"520\" y=\"118\" width=\"139\" height=\"24\" rx=\"6\" fill=\"var(--warn-bg)\"></rect><text x=\"528\" y=\"134\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--warn-fg)\">! J1 ne démarre pas</text></svg></div><div class=\"sgrid\"><div class=\"sbox\"><h3>Ce que ça change</h3><p>Le portail ouvre avec ses projets et ses formulaires ; les contacts sont gardés dans sa base de repli. Le don s’active dès que le circuit est validé, sans rien refaire.</p></div><div class=\"sbox\"><h3>Pertinence pour la FUG et la DFPU</h3><p>Sécurise le calendrier du portail entreprises et des médias, mais la collecte en ligne (J1) ne démarre pas tant que les dons restent fermés.</p></div><div class=\"sbox warnb\"><h3>Ce qui bloque aujourd’hui</h3><p>Rien côté technique : c’est le scénario par défaut si les validations tardent.</p></div><div class=\"sbox\"><h3>Qui débloque</h3><p>—</p></div><div class=\"sbox\"><h3>Offres compatibles</h3><p>Les six.</p></div></div></div><p class=\"note\">Licences GiveXpert et Eudonet, et commissions de paiement : hors offres, selon les contrats de l’UG.</p>"}, {"id": "a-decider", "group": "Ce qui reste à décider", "title": "Les points à décider", "html": "<p class=\"crumb\">Ce qui reste à décider</p><h2>Les points à décider, et par qui</h2><p class=\"q\">Choisir le prestataire n’est que la première décision. Les suivantes conditionnent le calendrier du portail : sans elles, le meilleur prestataire attend.</p><div class=\"sw tlw\"><svg class=\"schema\" viewBox=\"0 0 900 140\" role=\"img\" aria-label=\"Frise : les sept décisions, du 12 novembre au printemps 2027\" font-family=\"Montserrat, Arial, sans-serif\"><defs><marker id ojet et les dons fléchés</td></tr></tbody></table></div><p class=\"note\">Si le comité ne tranche pas le 12 novembre, il retient au moins deux finalistes et fixe qui arbitre, et avant quelle date.</p>"}]};

function mk(m,shortOnly){const [c,l]=MK[m];return `<span class="mk ${c}">${shortOnly?SHORT[m]:l}</span>`}
function buildNav(){
  let h="",g=null;
  views.forEach((v,i)=>{
    if(v.group&&v.group!==g){g=v.group;h+=`<div class="grp">${esc(g)}</div>`}
    h+=`<a href="#${v.id}" data-i="${i}"><span class="n">${i===0?"◆":i}</span><span>${esc(v.title)}</span></a>`;
  });
  document.getElementById("nav").innerHTML=h;
}
function buildChips(){
  const c=D.P.map((p,i)=>`<button class="chip" data-p="${i}" aria-pressed="false">${esc(p.replace(" (CRM Holding)",""))}</button>`).join("");
  document.getElementById("chips").innerHTML=`<button class="chip" data-p="-1" aria-pressed="true">Tous</button>`+c;
  document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{focus=+b.dataset.p;render(current())}));
}
function current(){const id=(location.hash||"").slice(1);const i=views.findIndex(v=>v.id===id);return i<0?0:i}
function overview(){
  let rows="";
  D.A.forEach((a,ai)=>{
    rows+=`<tr data-go="${a.id}" tabindex="0"><td class="asp">${esc(a.title)}<small>${esc(a.group)}</small></td>`+
      a.cells.map((c,pi)=>`<td class="${focus>=0&&focus!==pi?"dim":""}"><div class="cell">${mk(c[0],true)}<b>${esc(c[1])}</b></div></td>`).join("")+`</tr>`;
  });
  return `<p class="crumb">Lecture d’ensemble</p><h2>Ce que chaque offre implique, aspect par aspect</h2>
  <p class="q">Chaque ligne est un aspect du projet. Le repère dit ce que l’offre implique pour l’UG, sans désigner de gagnant. Choisissez une ligne pour voir le détail et ce qu’elle change pour l’équipe.</p>
  <div class="legend">${mk("+")}${mk("!")}${mk("?")}${mk("")}</div>
  <div class="tw"><table class="ov"><thead><tr><th>Aspect</th>${D.P.map((p,i)=>`<th class="${focus===i?"on":""}">${esc(p.replace(" (CRM Holding)",""))}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Prix calculés sur une base commune : L1, L2, douze mois de maintenance et connexion à Eudonet. Le classement relève de la notation commune présentée en séance.</p>`;
}
function aspect(a){
  const cards=a.cells.map((c,pi)=>`<article class="card ${focus===pi?"on":""} ${focus>=0&&focus!==pi?"dim":""}"><span class="who">${esc(D.P[pi])}</span>${mk(c[0])}<span class="val">${esc(c[1])}</span>${c[2]?`<p class="det">${esc(c[2])}</p>`:""}</article>`).join("");
  const opts=a.options?`<div class="opts"><h3>Les options, concrètement</h3><div class="tw"><table><thead><tr><th>Option</th><th>Concrètement</th><th>Pour l’équipe</th></tr></thead><tbody>${a.options.map(o=>`<tr><td><b>${esc(o[0])}</b></td><td>${esc(o[1])}</td><td>${esc(o[2])}</td></tr>`).join("")}</tbody></table></div></div>`:"";
  return `<p class="crumb">${esc(a.group)}</p><h2>${esc(a.title)}</h2><p class="q">${esc(a.q)}</p>
  <div class="grid">${cards}</div>${opts}
  <section class="impact"><h3>Ce que ça change pour le projet et l’équipe</h3><div>${a.impact.map(p=>`<p>${esc(p)}</p>`).join("")}</div></section>`;
}
function render(i){
  const v=views[i];
  document.getElementById("view").innerHTML=i===0?overview():(v.html?v.html:aspect(v));
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t===b)));document.querySelectorAll(".scp").forEach(p=>p.hidden=p.dataset.sc!==b.dataset.sc)}));
  document.querySelectorAll("nav a").forEach(a=>{if(+a.dataset.i===i)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.p===focus)));
  document.getElementById("pg").textContent=`${i+1} / ${views.length}`;
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===views.length-1;
  document.querySelectorAll("tr[data-go]").forEach(tr=>{
    const go=()=>{location.hash=tr.dataset.go};
    tr.addEventListener("click",go);
    tr.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
  });
}
function goto(i){i=Math.max(0,Math.min(views.length-1,i));location.hash=views[i].id}
window.addEventListener("hashchange",()=>{render(current());document.getElementById("scroll").scrollTop=0;document.getElementById("side").classList.remove("open");document.getElementById("menuBtn").setAttribute("aria-expanded","false")});
document.getElementById("prev").addEventListener("click",()=>goto(current()-1));
document.getElementById("next").addEventListener("click",()=>goto(current()+1));
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){goto(current()+1)}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){goto(current()-1)}
});
document.getElementById("menuBtn").addEventListener("click",()=>{const s=document.getElementById("side");const o=s.classList.toggle("open");document.getElementById("menuBtn").setAttribute("aria-expanded",String(o))});
buildNav();buildChips();render(current());
</script>
</body>
</html>
